  <rect x="45" y="61" width="166" height="134" rx="24"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="10"/>
  <rect x="68" y="118" width="120" height="17" rx="8.5" fill="#FF5721"/>
  <rect x="92" y="155" width="72" height="17" rx="8.5" fill="#FF5721"/>
</svg>
