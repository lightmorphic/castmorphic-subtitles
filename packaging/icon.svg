<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- An empty screen with captions in it: the frame carries no picture,
       because the app never fetches one. Castmorphic's palette and rounded
       bars, but its own mark rather than the parent's. -->
